<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Cold Mountain</title>
  </head>
  <body>
    <section id="loading-screen" aria-live="polite">
      <div class="loading-screen__content">
        <span class="loading-screen__eyebrow">COLD MOUNTAIN</span>
        <strong id="loading-status">Preparing the highlands</strong>
        <span class="loading-screen__line" aria-hidden="true"></span>
      </div>
    </section>
    <div id="position-hud" aria-label="Performance menu">
      <div class="fps-readout">fps: <span id="fps-value">0</span></div>
      <div class="position-readout">
        <div>x: <span id="position-x">0.00</span></div>
        <div>z: <span id="position-z">0.00</span></div>
        <div>y: <span id="position-y">0.00</span></div>
      </div>
      <div class="renderer-readout">
        <div>frame: <span id="frame-time-value">0.0</span> ms</div>
        <div>draws: <span id="draw-call-value">0</span></div>
        <div>tris: <span id="triangle-value">0</span></div>
        <div>geometries: <span id="geometry-value">0</span></div>
        <div>textures: <span id="texture-value">0</span></div>
        <div>programs: <span id="program-value">0</span></div>
        <div>scale: <span id="resolution-scale-value">1.00</span></div>
      </div>
      <label class="render-toggle">
        <input id="toggle-grass" type="checkbox" checked />
        <span>Grass</span>
      </label>
      <label class="render-toggle">
        <input id="toggle-trees" type="checkbox" checked />
        <span>Trees</span>
      </label>
      <label class="quality-control">
        <span>Quality</span>
        <select id="quality-select">
          <option value="performance">Performance</option>
          <option value="balanced" selected>Balanced</option>
          <option value="quality">Quality</option>
        </select>
      </label>
      <button id="edit-terrain" class="hud-button" type="button">Edit</button>
    </div>
    <section id="terrain-editor" class="terrain-editor" aria-hidden="true" hidden>
      <div class="terrain-editor-tools" role="group" aria-label="Terrain brushes">
        <button id="terrain-editor-raise" class="terrain-editor-button" type="button">Raise</button>
        <button id="terrain-editor-lower" class="terrain-editor-button" type="button">Lower</button>
      </div>
      <label class="terrain-editor-control">
        <span>Radius</span>
        <input id="terrain-editor-radius" type="range" min="0.5" max="10" step="0.1" />
      </label>
      <label class="terrain-editor-control">
        <span>Strength</span>
        <input id="terrain-editor-strength" type="range" min="0.1" max="3" step="0.1" />
      </label>
      <span id="terrain-editor-status" class="terrain-editor-status" aria-live="polite"></span>
      <button id="terrain-editor-save" class="terrain-editor-button" type="button">Save</button>
      <button id="terrain-editor-close" class="terrain-editor-button" type="button">Close</button>
    </section>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
